[project]
name = "casper"
version = "0.0.1"
description = "A self-hosted, private AI knowledge assistant that answers questions over your documents with citations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Freddie" }]
requires-python = ">=3.12"
# Runtime dependencies are deliberately empty. Add each one when you reach the
# plan day that needs it (e.g. `uv add fastapi` on Day 11), so you know why it is here.
dependencies = []

[project.scripts]
casper = "casper.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casper"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear (likely bugs),
# UP: pyupgrade (modern syntax), SIM: simplifications, S: bandit (security checks).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest works, so allow it in tests.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
